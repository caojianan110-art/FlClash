name: Build Windows Setup

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.27.1'

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e07f7316d2f9d46d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fSSL --retry 3 -o "$bundle" "https://curl.se"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup and Build Windows Installer
        run: dart setup.dart windows -v

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: XiangXiang-Windows-Setup
          path: ./dist/*
          overwrite: true
