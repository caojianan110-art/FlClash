name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix NDK libclang
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm-dev libclang-dev
          CLANG_SO=$(readlink -f $(find /usr/lib -name "libclang*.so*" | head -n 1))
          for ndk in /usr/local/lib/android/sdk/ndk/*; do
            mkdir -p "$ndk/toolchains/llvm/prebuilt/linux-x86_64/lib" "$ndk/toolchains/llvm/prebuilt/linux-x86_64/lib64"
            sudo cp -f "$CLANG_SO" "$ndk/toolchains/llvm/prebuilt/linux-x86_64/lib/libclang.so"
            sudo cp -f "$CLANG_SO" "$ndk/toolchains/llvm/prebuilt/linux-x86_64/lib64/libclang.so"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Build APK
        run: |
          flutter pub get
          curl -fSSL --retry 3 -o core/Clash.Meta/component/ca/ca-certificates.crt "https://curl.se"
          [ -f env.json ] || echo '{}' > env.json
          flutter build apk --release --target-platform android-arm64 --dart-define-from-file=env.json

      - uses: actions/upload-artifact@v4
        with:
          name: XiangXiang-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
