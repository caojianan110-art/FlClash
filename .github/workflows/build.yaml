name: Build Android APK

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.27.1'

jobs:
  build-android:
    name: Build Android arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fSSL --retry 3 -o "$bundle" "https://curl.se"

      - name: Setup and Build Android APK
        run: dart setup.dart android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: XiangYun-Android-APK
          path: ./dist/*
          overwrite: true
