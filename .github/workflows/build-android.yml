name: Build Android APK

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.27.1'

jobs:
  build-android:
    name: Build Android arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools & Export LIBCLANG_PATH
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libclang-dev build-essential pkg-config
          CLANG_LIB_DIR=$(dirname $(find /usr/lib/llvm-* -name "libclang.so*" | head -n 1))
          echo "LIBCLANG_PATH=$CLANG_LIB_DIR" >> $GITHUB_ENV
          echo "Found LIBCLANG_PATH: $CLANG_LIB_DIR"
          ls -lh "$CLANG_LIB_DIR"/libclang*
          for ndk in /usr/local/lib/android/sdk/ndk/*; do
            TARGET_LIB="$ndk/toolchains/llvm/prebuilt/linux-x86_64/lib"
            if [ -d "$TARGET_LIB" ]; then
              sudo cp -f "$CLANG_LIB_DIR"/libclang.so* "$TARGET_LIB/"
              sudo ln -sf "$TARGET_LIB"/libclang.so* "$TARGET_LIB/libclang.so"
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fSSL --retry 3 -o "$bundle" "https://curl.se"

      - name: Setup and Build Android APK
        run: dart setup.dart android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: XiangYun-Android-APK
          path: ./dist/*
          overwrite: true
